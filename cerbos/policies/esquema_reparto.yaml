# cerbos/policies/esquema_reparto.yaml — Recurso `esquema_reparto` (S3-20)
# Spec: PRD-02-05 Motor Contable · PRD-05-04 Cerbos RBAC §3.1 (estructura canónica).
#   superadmin global · org_admin CRUD en su organización ·
#   gestor SOLO lectura de los esquemas de sus edificios asignados.
# Por qué el gestor no escribe: configurar el reparto es más fuerte que cargar un
# gasto (cambia cuánto paga cada propietario en TODAS las liquidaciones futuras) y
# su fuente de autoridad es el reglamento de copropiedad —CCyC art. 2049, último
# párrafo—, no el criterio de quien administra el día a día. Mismo criterio que
# `gasto.yaml`, que ya le da al gestor solo `read`.
# Scope doble: organizacion_id del recurso == del principal, y para gestores
# edificio_id del recurso ∈ principal.attr.edificios_asignados.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "esquema_reparto"
  rules:
    # Superadmin puede todo
    - actions: ['*']
      effect: EFFECT_ALLOW
      roles:
        - superadmin

    # Org admin administra los esquemas de toda su organización
    - actions: ['read', 'create', 'update', 'delete']
      effect: EFFECT_ALLOW
      roles:
        - org_admin
      condition:
        match:
          expr: request.resource.attr.organizacion_id == request.principal.attr.organizacion_id

    # Gestor: solo lectura, y solo en sus edificios asignados
    - actions: ['read']
      effect: EFFECT_ALLOW
      roles:
        - gestor
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.organizacion_id == request.principal.attr.organizacion_id
              - expr: request.resource.attr.edificio_id in request.principal.attr.edificios_asignados
# Sin regla DENY global: en Cerbos un EFFECT_DENY matcheado tiene precedencia
# sobre cualquier ALLOW, y el default cuando ninguna regla matchea ya es DENY
# (fail-closed para residentes y cualquier rol futuro).
