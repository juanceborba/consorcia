# cerbos/policies/proveedor.yaml — Recurso `proveedor` (S3-01)
# Spec: PRD-04-02 §1.3 · PRD-05-04 Cerbos RBAC §3.1 (estructura canónica).
#
# El directorio es HÍBRIDO: hay proveedores globales de plataforma
# (`Proveedor.organizacionId = null`) y propios de cada organización. Eso
# define el contrato de attrs que deben mandar las rutas (S3-12):
#
#   organizacion_id : string — la org dueña del proveedor; **string vacío**
#                     ("") cuando es global. Nunca ausente: un attr faltante
#                     hace fallar la evaluación de la condición y Cerbos
#                     deniega (fail-closed), pero es un 403 confuso.
#   es_global       : bool  — true si `organizacionId` es null.
#
# En las acciones sobre la colección (listar / crear) el recurso es la
# organización activa: `organizacion_id` = org del JWT y `es_global` = false.
#
#   superadmin global (único que edita los globales, §1.3) ·
#   org_admin CRUD de los propios + lectura de los globales ·
#   gestor solo lectura (necesita el directorio para leer gastos).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "proveedor"
  rules:
    # Superadmin puede todo, incluido administrar el catálogo global
    - actions: ['*']
      effect: EFFECT_ALLOW
      roles:
        - superadmin

    # Org admin administra los proveedores propios de su organización
    - actions: ['read', 'create', 'update', 'delete']
      effect: EFFECT_ALLOW
      roles:
        - org_admin
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.es_global == false
              - expr: request.resource.attr.organizacion_id == request.principal.attr.organizacion_id

    # Cualquier staff (org_admin o gestor) lee el catálogo global de plataforma
    - actions: ['read']
      effect: EFFECT_ALLOW
      roles:
        - org_admin
        - gestor
      condition:
        match:
          expr: request.resource.attr.es_global == true

    # Gestor: lectura de los propios de su organización, sin escritura
    - actions: ['read']
      effect: EFFECT_ALLOW
      roles:
        - gestor
      condition:
        match:
          expr: request.resource.attr.organizacion_id == request.principal.attr.organizacion_id
# Sin regla DENY global: el default cuando ninguna regla matchea ya es DENY
# (gestor escribiendo, residentes y cualquier rol futuro quedan afuera).
