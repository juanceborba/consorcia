# .github/workflows/ci.yml — Gate de calidad ConsorcIA
# Implementa la regla del AGENTS.md: ningún commit llega a main sin
# tests del backend + build del frontend en verde. (PRD-08-02 §2, subconjunto MVP)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: consorcia
          POSTGRES_PASSWORD: consorcia_dev_2026
          POSTGRES_DB: consorcia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consorcia -d consorcia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Levantar Cerbos (PDP)
        # El rbac.middleware es fail-closed: sin PDP las rutas con autorización
        # devuelven 403. Corre como step porque los service containers no pueden
        # montar archivos del repo (arrancan antes del checkout).
        run: |
          docker run -d --name cerbos -p 3592:3592 \
            -v ${{ github.workspace }}/cerbos/policies:/policies \
            -v ${{ github.workspace }}/cerbos/config.yaml:/config.yaml \
            ghcr.io/cerbos/cerbos:latest server --config=/config.yaml
          sleep 5

      - name: Migraciones + seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://consorcia:consorcia_dev_2026@localhost:5432/consorcia?schema=consorcia
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Tests de API (gate)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://consorcia:consorcia_dev_2026@localhost:5432/consorcia?schema=consorcia
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          CERBOS_HOST: localhost
          CERBOS_PORT: 3592
          JWT_SECRET: ci_test_secret
          PORT: 3000
          NODE_ENV: test
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (gate)
        # Corre dentro de node:20-alpine (misma plataforma musl que el contenedor
        # de desarrollo donde se generó el lockfile). En el runner Ubuntu (gnu),
        # npm ci/install falla con @rollup/rollup-linux-x64-gnu (bug npm/cli#4828).
        run: docker run --rm -v ${{ github.workspace }}/frontend:/app -w /app node:20-alpine sh -c "npm ci && npm run build"
